<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-row">
                <div>
                    <h1>Todo List</h1>
                    <p>오늘도 하나씩, 차근차근.</p>
                </div>
                <button class="add-btn" onclick="openModal()">+ 추가</button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-number" th:text="${list != null ? list.size() : 0}">0</div>
                <div class="stat-label">전체</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="categoryCount">0</div>
                <div class="stat-label">카테고리</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="soonCount">0</div>
                <div class="stat-label">마감 임박</div>
            </div>
        </div>

        <!-- Todo List -->
        <div class="todo-list" th:if="${list != null and !list.isEmpty()}">
            <div class="todo-card" th:each="todo : ${list}" th:attr="data-category=${todo.category}">
                <div class="todo-top">
                    <span class="todo-title" th:text="${todo.title}">제목</span>
                    <span class="category-badge" th:attr="data-category=${todo.category}"
                        th:text="${todo.category}">Category</span>
                </div>
                <div class="todo-summary" th:text="${todo.summary}">요약 내용</div>
                <div class="todo-footer">
                    <svg class="date-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                        <line x1="16" y1="2" x2="16" y2="6" />
                        <line x1="8" y1="2" x2="8" y2="6" />
                        <line x1="3" y1="10" x2="21" y2="10" />
                    </svg>
                    <span class="todo-date" th:text="${#temporals.format(todo.date, 'yyyy년 MM월 dd일')}"
                        th:classappend="${todo.date.isBefore(T(java.time.LocalDate).now())} ? 'overdue' : (${todo.date.isBefore(T(java.time.LocalDate).now().plusDays(7))} ? 'soon' : '')">
                        날짜
                    </span>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div class="empty-state" th:if="${list == null or list.isEmpty()}">
            <div class="emoji">🎉</div>
            <p>할 일이 없습니다. 오늘은 쉬어가세요!</p>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal" onclick="handleOverlayClick(event)">
        <div class="modal">
            <div class="modal-header">
                <h2>새 할 일 추가</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form th:action="@{/add}" method="post" class="modal-form">
                <div class="form-group">
                    <label for="category">카테고리</label>
                    <select id="category" name="category" required>
                        <option value="" disabled selected>선택하세요</option>
                        <option value="Study">Study</option>
                        <option value="Project">Project</option>
                        <option value="Career">Career</option>
                        <option value="Health">Health</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="title">제목</label>
                    <input type="text" id="title" name="title" placeholder="할 일 제목을 입력하세요" required>
                </div>
                <div class="form-group">
                    <label for="summary">내용</label>
                    <input type="text" id="summary" name="summary" placeholder="간단한 설명을 입력하세요" required>
                </div>
                <div class="form-group">
                    <label for="date">마감일</label>
                    <input type="date" id="date" name="date" required>
                </div>
                <button type="submit" class="submit-btn">추가하기</button>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function () {
            const cards = document.querySelectorAll('.todo-card');
            const categories = new Set();
            let soonCount = 0;

            cards.forEach(card => {
                categories.add(card.getAttribute('data-category'));
            });

            document.querySelectorAll('.todo-date.soon, .todo-date.overdue').forEach(() => soonCount++);

            document.getElementById('categoryCount').textContent = categories.size;
            document.getElementById('soonCount').textContent = soonCount;
        });

        function openModal() {
            document.getElementById('modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.body.style.overflow = '';
        }

        function handleOverlayClick(e) {
            if (e.target === document.getElementById('modal')) {
                closeModal();
            }
        }

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>

</html>
